name: 🚀 Deploy to Budget Cleaning

on:
  push:
    branches:
      - main

# This fix handles the Node.js warning you saw
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Update sitemap lastmod
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i "s#<lastmod>.*</lastmod>#<lastmod>$TODAY</lastmod>#g" sitemap.xml
          echo "Sitemap updated to $TODAY"

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Use your secret names here
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Path on the GoDaddy server
          server-dir: public_html/
          # This helps bypass GoDaddy's strict firewall
          protocol: ftp
          port: 21
